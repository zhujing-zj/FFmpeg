name: m3-bench-quick

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: brew install nasm || true

      - name: Configure
        run: |
          sysctl -n machdep.cpu.brand_string || true
          ./configure --disable-doc --disable-ffmpeg --disable-ffplay --disable-ffprobe --disable-network --disable-autodetect

      - name: Build + bench baseline (39ccb3ca12)
        run: |
          git checkout 39ccb3ca12
          make -j4 checkasm
          ./tests/checkasm/checkasm --test=sw_scale --bench | tee bench_before.txt

      - name: Build + bench c1 smull (863ab06e5f)
        run: |
          git checkout c1-smull
          make -j4 checkasm
          ./tests/checkasm/checkasm --test=sw_scale --bench | tee bench_c1.txt

      - name: Build + bench combined c1+c2+c3
        run: |
          git checkout c123-combined
          make -j4 checkasm
          ./tests/checkasm/checkasm --test=sw_scale --bench | tee bench_c123.txt

      - name: Collect outputs
        if: always()
        run: |
          for f in bench_before.txt bench_c1.txt bench_c123.txt; do
            if [ -f "$f" ]; then
              echo "===== $f =====" >> "$GITHUB_STEP_SUMMARY"
              grep -E "hscale_8_to_15__fs_4|hscale_8_to_19__fs_4|Timing" "$f" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-outputs
          path: bench_*.txt
